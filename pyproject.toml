[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshd"
version = "0.1.0"
description = "batman-adv drone mesh control-plane daemon (Mesh Rider OS-style software stack)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
telemetry = ["pymavlink>=2.4.37"]
dashboard = ["flask>=2.3"]
test = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
meshd = "meshd.main:main"
meshctl = "meshd.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meshd = ["**/*.jinja2", "**/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]